# EINE Sonde, keine Reihe. Frage: schafft ein Modell die Aufgabe ueberhaupt in
# einem Zug, ohne Werkzeuge, ohne Dateien, ohne zweite Runde?
#
# Behauptet war "nein". Behauptet ist keine Messung. Ein Lauf beantwortet es,
# und erst danach steht fest, ob "ohne Pruefstand kein Erfolg" ein Befund ist
# oder eine Vermutung.
#
#   game_run.sh config/qwen3-coder-30b-a3b-sonde-direkt.conf

model     = qwen3-coder-30b-a3b
gguf      = /opt/llm-infra/models/qwen3-coder-30b-a3b/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
beschreibung = sonde

# direkt = ein einzelner Aufruf an llama-server. Kein Werkzeugzugriff, kein
# Dateisystem, keine Rueckmeldung, keine zweite Runde.
harness   = direkt

temp      = 0.2
maxtok    = 16384
ctx       = 32768
seed      = -1
template  = gguf
