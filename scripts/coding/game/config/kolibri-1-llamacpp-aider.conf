# Kolibri-1 (Aleph Alpha, 20.10.): kolibri1 architecture only in the patched build; 45 GB, so the
# experts of 28 layers stay on the CPU (night probe 10.10.). Otherwise the same settings as every model.
model        = kolibri-1
quant        = Q4_K_M
gguf         = /opt/llm-infra/models/kolibri-1/Kolibri-1-Q4_K_M.gguf
beschreibung = llamacpp
runtime      = llamacpp
harness      = aider
build        = /opt/llama-cpp-kolibri
extra        = -ncmoe 28
temp         = 0.2
maxtok       = 16384
ctx          = 32768
template     = gguf
zeitlimit    = 3600
aufgabe      = aufgabe.md
