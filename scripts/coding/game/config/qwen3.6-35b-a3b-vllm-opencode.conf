# ONE run: one model, one runtime, one harness, one set of parameters.
# Usage:   game_run.sh config/qwen3.6-35b-a3b-vllm-opencode.conf
#
# Both runtimes are always measured. If a model's tool calls do not run
# cleanly on one of them, that is the result for that runtime -- and it does
# not get hidden by taking the other one.

model        = qwen3.6-35b-a3b
# vLLM does not read GGUF. Which weights go here is decided by the attempt
# with the image -- a different quantisation is allowed and gets carried along
# in the result row, not kept quiet.
# The call style vLLM wants named explicitly. llama.cpp derives it from the
# template in the GGUF -- a difference between the runtimes, not a detail.
tool_parser  = hermes

quant        = Q4_K_M
hf           = /opt/llm-infra/models/qwen3.6-35b-a3b/Qwen3.6-35B-A3B-Q4_K_M.gguf
beschreibung = vllm

# llamacpp = llama-server on the measuring machine, template from the GGUF (--jinja)
# vllm     = vLLM-ROCm in a container on the measuring machine
runtime      = vllm

# opencode = full harness: create files, run commands, read their output.
#            Encapsulated in a container on .201.
harness      = opencode

temp         = 0.2
maxtok       = 16384
ctx          = 32768
template     = gguf
zeitlimit    = 3600
aufgabe      = aufgabe.md
