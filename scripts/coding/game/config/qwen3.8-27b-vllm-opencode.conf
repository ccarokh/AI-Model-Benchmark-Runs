# EIN Lauf: ein Modell, eine Laufzeit, ein Pruefstand, ein Parametersatz.
# Aufruf:  game_run.sh config/qwen3.8-27b-vllm-opencode.conf
#
# Beide Laufzeiten werden immer gemessen. Laufen die Werkzeugaufrufe eines
# Modells auf einer davon nicht sauber durch, ist das das Ergebnis fuer diese
# Laufzeit -- und wird nicht dadurch versteckt, dass man die andere nimmt.

model        = qwen3.8-27b
# vLLM liest kein GGUF. Welche Gewichte hier stehen, entscheidet der
# Versuch mit dem Abbild -- eine andere Quantisierung ist erlaubt und
# wird in der Ergebniszeile mitgefuehrt, nicht verschwiegen.
quant        = OFFEN
hf           = OFFEN
beschreibung = vllm

# llamacpp = llama-server auf dem Messrechner, Vorlage aus der GGUF (--jinja)
# vllm     = vLLM-ROCm im Behaelter auf dem Messrechner
runtime      = vllm

# opencode = voller Pruefstand: Dateien anlegen, Befehle ausfuehren, deren
#            Ausgabe lesen. Gekapselt in einem Behaelter auf .201.
harness      = opencode

temp         = 0.2
maxtok       = 16384
ctx          = 32768
template     = gguf
zeitlimit    = 3600
aufgabe      = task.md
