<!doctype html>
<meta charset="utf-8">
<title>Agility-Spiele bewerten</title>
<style>
  :root {
    --grund: #14161a; --karte: #1c1f26; --rand: #2b303b; --schrift: #e6e9ef;
    --leise: #99a1b3; --gruen: #35c46a; --gelb: #e0a740; --grau: #5a6172;
    --ja: #1f6f42; --nein: #7a2f34;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--grund); color: var(--schrift);
         font: 15px/1.5 system-ui, sans-serif; }

  /* Der Gesamtstand klebt oben und ist die groesste Zahl auf der Seite --
     "2 von 2" als Fliesstext ging unter. */
  header { position: sticky; top: 0; z-index: 10; background: var(--karte);
           border-bottom: 1px solid var(--rand); padding: 14px 20px 0; }
  .kopf { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .kopf h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .kopf .hinweis { color: var(--leise); font-size: 13px; }
  .stand { margin-left: auto; font-size: 28px; font-weight: 700; letter-spacing: -.5px; }
  .stand small { font-size: 14px; font-weight: 500; color: var(--leise); }
  .balken { height: 6px; background: var(--rand); border-radius: 3px; margin: 12px 0 0; }
  .balken > div { height: 100%; background: var(--gruen); border-radius: 3px; width: 0; transition: width .2s; }
  header .luft { height: 12px; }

  main { max-width: 900px; margin: 0 auto; padding: 22px 20px 80px; }

  .karte { background: var(--karte); border: 1px solid var(--rand);
           border-left: 5px solid var(--grau); border-radius: 10px;
           margin: 0 0 18px; padding: 16px 18px; }
  .karte.fertig { border-left-color: var(--gruen); }
  .karte.begonnen { border-left-color: var(--gelb); }

  .titel { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .titel h2 { font-size: 18px; margin: 0; font-weight: 650; }
  .marke { font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 999px;
           text-transform: uppercase; letter-spacing: .4px; white-space: nowrap; }
  .marke.fertig { background: var(--gruen); color: #06210f; }
  .marke.begonnen { background: var(--gelb); color: #2a1c00; }
  .marke.offen { background: var(--rand); color: var(--leise); }
  .spielen { margin-left: auto; background: #2d64d8; color: #fff; text-decoration: none;
             font-weight: 650; padding: 9px 18px; border-radius: 8px; }
  .spielen:hover { background: #3b76ef; }
  .fehlt { margin-left: auto; color: var(--nein); font-weight: 650; }

  /* Was den Lauf ausmacht, gehoert auf die Karte. Sonst steht dort ein Wort
     wie "direkt", das niemand einordnen kann. */
  .lauf { margin: 12px 0 0; background: var(--grund); border: 1px solid var(--rand);
          border-radius: 8px; padding: 11px 13px; }
  .lauf .zeile { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; }
  .lauf .stueck { color: var(--leise); }
  .lauf .stueck b { color: var(--schrift); font-weight: 650; }
  .lauf p { margin: 8px 0 0; font-size: 13px; color: var(--leise); line-height: 1.45; }
  .dateien { color: var(--leise); font-size: 12.5px; margin: 10px 0 0;
             font-family: ui-monospace, monospace; word-break: break-all; }

  table { width: 100%; border-collapse: collapse; margin: 14px 0 0; }
  td { padding: 7px 0; border-top: 1px solid var(--rand); vertical-align: middle; }
  td.frage { font-size: 14.5px; }
  tr.haupt td.frage { font-weight: 650; }
  tr.offen td.frage::before { content: "?"; display: inline-block; width: 18px;
                              color: var(--gelb); font-weight: 700; }
  tr:not(.offen) td.frage::before { content: ""; display: inline-block; width: 18px; }
  td.wahl { width: 268px; text-align: right; white-space: nowrap; }

  /* Umschaltgruppe statt drei nackter Schaltflaechen. Der erste Entwurf sah
     nicht klickbar aus und zeigte die Auswahl kaum -- beides ist bei einem
     Werkzeug, das nur aus Klicken besteht, kein Schoenheitsfehler. */
  .gruppe { display: inline-flex; gap: 3px; padding: 3px;
            background: var(--grund); border: 1px solid var(--rand);
            border-radius: 11px; }
  button.w { appearance: none; border: 0; border-radius: 8px;
             padding: 7px 15px; font: inherit; font-size: 13px; font-weight: 600;
             color: var(--leise); background: transparent; cursor: pointer;
             transition: background .12s, color .12s, transform .06s; }
  button.w:hover { background: #ffffff14; color: var(--schrift); }
  button.w:active { transform: scale(.96); }
  button.w:focus-visible { outline: 2px solid #4a8bff; outline-offset: 2px; }
  button.w.an { color: #fff; box-shadow: 0 1px 0 #0004, inset 0 1px 0 #ffffff26; }
  button.w.an[data-w="ja"] { background: #22a55c; color: #04240f; }
  button.w.an[data-w="nein"] { background: #d24a4a; color: #2b0808; }
  button.w.an[data-w="untestbar"] { background: #6b7688; color: #fff; }
  /* Die getroffene Wahl bleibt auch beim Ueberfahren stehen. */
  button.w.an:hover { filter: brightness(1.08); }

  .fuss { display: flex; align-items: center; gap: 12px; margin: 14px 0 0; }
  .fuss input { flex: 1; background: var(--grund); border: 1px solid var(--rand);
                color: var(--schrift); border-radius: 7px; padding: 8px 11px; font: inherit; }
  .gespeichert { color: var(--leise); font-size: 12px; white-space: nowrap; min-width: 92px; }

  details { margin: 12px 0 0; }
  summary { cursor: pointer; color: var(--leise); font-size: 13px; }
  details table td { font-size: 12.5px; color: var(--leise); }
</style>

<header>
  <div class="kopf">
    <h1>Agility-Spiele</h1>
    <span class="hinweis">Erst spielen, dann abhaken · jede Änderung wird sofort gespeichert</span>
    <span class="stand" id="stand">– <small>fertig</small></span>
  </div>
  <div class="balken"><div id="balken"></div></div>
  <div class="luft"></div>
</header>

<main id="liste"></main>

<script>
let KRIT = [], URTEILE = {};

// Drei Zustaende: true, false, nicht vorhanden. Ein Haekchen kann das nicht --
// leer hiesse dort gleichzeitig "nein" und "noch nicht angesehen", und dann
// gibt es kein Fertig.
const beantwortet = u => KRIT.filter(([k]) => u && k in u).length;
const istFertig   = u => beantwortet(u) === KRIT.length;

async function laden() {
  const d = await (await fetch("/modelle")).json();
  KRIT = d.kriterien; URTEILE = d.urteile || {};
  zeichnen(d.modelle);
}

function zustand(u) {
  const n = beantwortet(u);
  if (n === KRIT.length) return ["fertig", "fertig"];
  if (n === 0)           return ["offen", "nicht bewertet"];
  return ["begonnen", "noch " + (KRIT.length - n) + " offen"];
}

function standAktualisieren(modelle) {
  const fertig = modelle.filter(m => istFertig(URTEILE[m.modell])).length;
  document.getElementById("stand").innerHTML =
    fertig + " von " + modelle.length + " <small>fertig</small>";
  document.getElementById("balken").style.width =
    (modelle.length ? fertig / modelle.length * 100 : 0) + "%";
}

let zeilenAuffrischer = [], kartenAuffrischer = [], MODELLE = [];

function auffrischen() {
  for (const f of zeilenAuffrischer) f();
  for (const f of kartenAuffrischer) f();
  standAktualisieren(MODELLE);
}

function zeichnen(modelle) {
  MODELLE = modelle;
  zeilenAuffrischer = []; kartenAuffrischer = [];
  const l = document.getElementById("liste");
  l.textContent = "";
  for (const m of modelle) {
    const [kl, wort] = zustand(URTEILE[m.modell] || {});

    const k = document.createElement("section");
    k.className = "karte " + kl;

    const t = document.createElement("div"); t.className = "titel";
    const kopf = m.kopf || {};
    const u = URTEILE[m.modell] || {};
    const h = document.createElement("h2");
    h.textContent = kopf.model || m.modell;
    const mk = document.createElement("span"); mk.className = "marke " + kl; mk.textContent = wort;
    kartenAuffrischer.push(() => {
      const [k2, w2] = zustand(URTEILE[m.modell] || {});
      k.className = "karte " + k2; mk.className = "marke " + k2; mk.textContent = w2;
    });
    t.append(h, mk);
    if (m.hat_index) {
      const a = document.createElement("a");
      // Schraegstrich am Ende ist Pflicht, sonst zeigen relative Verweise
      // im Spiel eine Ebene zu hoch.
      a.className = "spielen"; a.href = "/spiel/" + encodeURIComponent(m.modell) + "/";
      a.target = "_blank"; a.rel = "noopener"; a.textContent = "Spielen ▸";
      t.append(a);
    } else {
      const s = document.createElement("span");
      s.className = "fehlt"; s.textContent = "keine index.html";
      t.append(s);
    }
    k.append(t);

    if (kopf.harness) {
      const lz = document.createElement("div"); lz.className = "lauf";
      const z = document.createElement("div"); z.className = "zeile";
      const teile = [["Prüfstand", kopf.harness], ["Laufzeit", kopf.runtime],
                     ["Temperatur", kopf.temp],
                     ["Vorlage", kopf.template === "gguf" ? "aus der GGUF" : kopf.template]];
      for (const [n, v] of teile) {
        if (v === undefined || v === null || v === "") continue;
        const sp = document.createElement("span"); sp.className = "stueck";
        sp.append(n + " ");
        const b = document.createElement("b"); b.textContent = v; sp.append(b);
        z.append(sp);
      }
      lz.append(z);
      for (const t of [kopf.harness_text, kopf.runtime_text]) {
        if (!t) continue;
        const p = document.createElement("p"); p.textContent = t; lz.append(p);
      }
      k.append(lz);
    }

    const dz = document.createElement("p"); dz.className = "dateien";
    dz.textContent = "Vom Prüfstand angelegt:  " + (m.dateien || []).join("  ")
                     + (m.bytes ? "  ·  index.html " + m.bytes + " Bytes" : "");
    k.append(dz);

    const tab = document.createElement("table");
    for (const [key, text] of KRIT) {
      const tr = document.createElement("tr");
      if (!(key in u)) tr.classList.add("offen");
      if (key === "spielbar") tr.classList.add("haupt");
      const td1 = document.createElement("td"); td1.className = "frage"; td1.textContent = text;
      const td2 = document.createElement("td"); td2.className = "wahl";
      const gruppe = document.createElement("div"); gruppe.className = "gruppe";
      // Untestbar ist kein Ausweichen: wenn das Spiel nicht startet, hat
      // niemand gesehen, ob es schneller wird. Als "Nein" gezaehlt waere das
      // eine erfundene Beobachtung.
      const WAHL = [["ja", "Ja", true], ["nein", "Nein", false],
                    ["untestbar", "Untestbar", "untestbar"]];
      const knoepfe = [];
      for (const [id, text, wert] of WAHL) {
        const b = document.createElement("button");
        // Die Grundklasse MUSS hier stehen. Sie ist beim Umbau auf punktgenaue
        // Auffrischung verlorengegangen, der Auffrischer setzt nur noch "an" --
        // und "button.w" traf danach nichts. Ergebnis: Standardknoepfe des
        // Browsers, keine sichtbare Auswahl, und ein Bewertungswerkzeug, das
        // nicht zeigt, was bewertet wurde.
        b.className = "w";
        b.dataset.w = id; b.textContent = text;
        b.onclick = () => {
          // Zustand IMMER frisch aus URTEILE lesen, nie aus einer beim Zeichnen
          // eingefrorenen Kopie -- sonst rechnet ein zweiter Klick gegen einen
          // veralteten Wert.
          const jetzt = URTEILE[m.modell] || {};
          const neu = (key in jetzt && jetzt[key] === wert) ? null : wert;
          senden(m.modell, { [key]: neu });
        };
        knoepfe.push([b, wert]);
        gruppe.append(b);
      }
      td2.append(gruppe);
      tr.append(td1, td2); tab.append(tr);
      // Diese Zeile aktualisiert sich selbst -- ohne dass die Liste neu entsteht.
      // Ein Neuaufbau unter dem Mauszeiger war der Grund, warum ein Klick auf
      // "Ja" gelegentlich als "Nein" in der Nachbarzelle landete.
      zeilenAuffrischer.push(() => {
        const jetzt = URTEILE[m.modell] || {};
        tr.classList.toggle("offen", !(key in jetzt));
        for (const [b, wert] of knoepfe)
          b.classList.toggle("an", key in jetzt && jetzt[key] === wert);
      });
    }
    k.append(tab);

    const f = document.createElement("div"); f.className = "fuss";
    const ein = document.createElement("input");
    ein.placeholder = "Bemerkung (freiwillig)"; ein.value = u.kommentar || "";
    let uhr; ein.oninput = () => { clearTimeout(uhr);
      uhr = setTimeout(() => senden(m.modell, { kommentar: ein.value }, true), 600); };
    const g = document.createElement("span"); g.className = "gespeichert";
    g.id = "g_" + m.modell;
    g.textContent = u.zeit ? new Date(u.zeit).toLocaleTimeString("de-DE").slice(0, 5) + " gespeichert" : "";
    f.append(ein, g); k.append(f);

    l.append(k);
  }
  standAktualisieren(modelle);
}

async function senden(modell, feld, still) {
  const r = await fetch("/urteil", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ modell }, feld)) });
  if (!r.ok) { alert("Nicht gespeichert: " + await r.text()); return; }
  const antwort = await r.json();
  // Der Server bleibt die Wahrheit, aber die Liste wird NICHT neu gebaut --
  // nur die betroffenen Stellen frischen sich auf.
  if (antwort.urteil) URTEILE[modell] = antwort.urteil;
  auffrischen();
  const g = document.getElementById("g_" + modell);
  if (g) g.textContent = new Date().toLocaleTimeString("de-DE").slice(0, 5) + " gespeichert";
}

laden();
</script>
