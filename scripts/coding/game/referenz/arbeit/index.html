<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Agility — Referenz</title>
<style>
  html,body{margin:0;height:100%;background:#20242c;color:#e8ecf4;
            font:15px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;
            align-items:center;justify-content:center;gap:12px}
  canvas{background:#bfe3f7;border-radius:10px;box-shadow:0 6px 24px #0007;max-width:96vw;
         display:block}
  /* Die Schaltflaeche gehoert INS Spielfeld, wie im Original -- deshalb ein
     Rahmen um die Flaeche, in dem sie mittig sitzt. */
  .feld{position:relative}
  .feld button{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%)}
  .hilfe{opacity:.8}
  /* Neustart muss auch ohne Tastatur gehen -- deshalb eine echte Schaltflaeche
     und zusaetzlich ein Klick auf die Flaeche, wenn das Spiel vorbei ist. */
  button{font:inherit;font-weight:600;padding:9px 20px;border-radius:8px;border:0;
         background:#2d64d8;color:#fff;cursor:pointer}
  button:hover{background:#3b76ef}
  b{color:#ffd479}
</style>
</head>
<body>
<div class="feld"><canvas id="c" width="900" height="320"></canvas>
<button id="neustart" hidden>Neu starten</button></div>
<div class="hilfe"><b>Leertaste</b> oder <b>W</b> springen ·
<b>Strg</b> oder <b>S</b> ducken (halten) ·
<b>R</b> oder <b>Enter</b> neu</div>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
const BODEN = 250;

// Sprunghoehe gegen Huerdenhoehe -- nachgerechnet, nicht geschaetzt.
// Erster Entwurf: 560 px/s gegen 1750 px/s^2 ergibt 89 px Scheitel. Eine 52 px
// hohe Huerde durchquert den Hund in 0,33 s, hoeher als 52 px ist er 0,41 s --
// also 0,08 s Spielraum fuer den Absprung. Rechnerisch moeglich, praktisch
// unspielbar. Jetzt: 144 px Scheitel, 0,63 s ueber der Huerde gegen 0,30 s
// Durchquerung. Ein Sprung zur richtigen Zeit reicht, ohne Millisekundenglueck.
// Bis zu drei Huerden koennen direkt hintereinander stehen, und eine Gruppe muss
// mit EINEM Sprung zu schaffen sein. Das ist eine Pruefung der Sprungweite, nicht
// der Hoehe: der Hund (56 breit) plus drei Huerden a 26 sind 134 px, die bei
// niedrigstem Tempo 0,52 s zum Durchqueren brauchen. Ueber Huerdenhoehe ist er
// 0,74 s. Nachgerechnet, nicht geschaetzt.
const SPRUNGKRAFT = -850, SCHWERKRAFT = 1750;
// Huerden einer Gruppe stehen mit Luecke, nicht auf Stoss. Lueckenlos sahen
// drei 26 px breite Huerden aus wie EINE breite -- die Gruppe war unsichtbar,
// nicht selten. Abstand 32 bei Breite 26 laesst 6 px Luft; drei ergeben 90 px.
// Hund 68 + 90 = 158 px Durchquerung, bei niedrigstem Tempo 0,61 s gegen 0,86 s
// ueber Huerdenhoehe. Nachgerechnet.
const HUERDE_ABSTAND = 32;

// --- Zustand ---------------------------------------------------------------
let hund, hindernisse, punkte, tempo, laeuft, weg, zeit, spawn;
let beutel = [];

let best = 0;
try { best = parseInt(localStorage.getItem('agility_best') || '0', 10) || 0; } catch (e) {}

function neu() {
  hund = { y: 0, vy: 0, springt: false, duckt: false };
  hindernisse = [];
  punkte = 0; tempo = 260; laeuft = true; weg = 0; zeit = 0; spawn = 60;
}
neu();

// --- Eingabe ---------------------------------------------------------------
const DUCKTASTEN = ['ControlLeft', 'ControlRight', 'KeyS'];
// Ducken ist ein ZUSTAND, kein Ereignis. Erster Entwurf verwarf ein keydown,
// das waehrend eines Sprungs kam -- und wer die Taste gedrueckt HAELT, bekommt
// beim Aufsetzen kein zweites keydown. Der Hund duckte sich dann nie wieder,
// solange die Taste unten blieb. Jetzt wird nur gemerkt, ob die Taste liegt;
// ob geduckt wird, entscheidet die Schleife beim Aufsetzen.
let duckTasteLiegt = false;
// Springen und Ducken sind streng getrennt: in der Luft wird nicht geduckt,
// und geduckt wird nicht gesprungen. Genau das ist die Anforderung.
addEventListener('keydown', e => {
  // Pflicht plus die in der Aufgabe erlaubten Alternativen -- und nichts sonst.
  if (e.code === 'Space' || e.code === 'KeyW') {
    e.preventDefault();
    if (laeuft && !hund.springt) { hund.vy = SPRUNGKRAFT; hund.springt = true; }
  }
  if (DUCKTASTEN.includes(e.code)) {
    e.preventDefault();
    duckTasteLiegt = true;
  }
  // Enter loest zusaetzlich aus. Liegt der Fokus auf der Schaltflaeche, klickt
  // der Browser sie ohnehin -- dann startet zweimal neu, was nichts schadet.
  if (e.code === 'KeyR' || e.code === 'Enter' || e.code === 'NumpadEnter') neu();
});
const knopf = document.getElementById('neustart');
knopf.onclick = () => { neu(); knopf.blur(); };
c.addEventListener('click', () => { if (!laeuft) neu(); });
addEventListener('keyup', e => { if (DUCKTASTEN.includes(e.code)) duckTasteLiegt = false; });
// Verliert das Fenster den Fokus, kommt das keyup nie an -- und eine haengende
// Modifikatortaste wuerde das Spiel lahmlegen.
addEventListener('blur', () => { duckTasteLiegt = false; });

// --- Hindernisse -----------------------------------------------------------
// Huerde: steht auf dem Boden, oben offen  -> nur Springen hilft.
// Tunnel: haengt oben, unten offen         -> nur Ducken hilft.
function setzen() {
  const huerde = Math.random() < 0.5;
  hindernisse.push(huerde
    ? { art: 'huerde', x: c.width + 40, breite: 26, hoehe: 46 }
    : { art: 'tunnel', x: c.width + 40, breite: 120, lichte: 46 });
}

const HUND_X = 120;
function rahmen() {
  // Der Koerper des Hundes, in Weltkoordinaten. Beim Ducken flacher UND laenger.
  const h = hund.duckt ? 29 : 42;      // Rumpfhoehe plus Beine
  const b = hund.duckt ? 84 : 68;      // Rumpflaenge plus Kopf
  return { x: HUND_X, y: BODEN - h + hund.y, b, h };
}
function stoss(o) {
  const r = rahmen();
  if (o.art === 'huerde') {
    const hx = o.x, hb = o.breite, hy = BODEN - o.hoehe;
    return r.x < hx + hb && r.x + r.b > hx && r.y + r.h > hy;
  }
  // Tunnel: Decke bei BODEN-lichte. Wer zu hoch ist, stoesst an.
  const dy = BODEN - o.lichte;
  return r.x < o.x + o.breite && r.x + r.b > o.x && r.y < dy;
}

// --- Zeichnen --------------------------------------------------------------
function hundZeichnen(t) {
  const r = rahmen(), duckt = hund.duckt;
  const L = duckt ? 66 : 54;              // Rumpflaenge, alles andere leitet sich ab
  const H = duckt ? 17 : 22;              // Rumpfhoehe
  const beinL = duckt ? 12 : 20;          // kuerzer als der Rumpf lang ist
  const kopfB = L * 0.34, kopfH = H * 0.82;
  const takt = t * 13, a1 = Math.sin(takt), a2 = Math.sin(takt + Math.PI);

  g.save();
  g.translate(r.x, r.y);

  // Vier Beine, als HINTER- und VORDERPAAR -- nicht alle am Hinterteil. Das
  // hintere Paar sitzt an der Huefte, das vordere unter der Brust kurz vor dem
  // Kopf. Die abgewandte Seite wird zuerst und dunkler gezeichnet, damit man
  // vier Beine in zwei Ebenen sieht statt zwei dicker Striche.
  // Sie beginnen 6 px INNERHALB des Rumpfes, dann kann keine Luecke entstehen.
  const bein = (bx, ph, farbe) => {
    g.strokeStyle = farbe;
    g.beginPath();
    g.moveTo(bx, H - 6);
    g.lineTo(bx + ph * 6, H + beinL);
    g.stroke();
  };
  g.lineWidth = 6; g.lineCap = 'round';
  bein(L * 0.20, a2, '#6b4320');     // hinten, abgewandt
  bein(L * 0.78, a1, '#6b4320');     // vorne,  abgewandt

  // Schwanz, am Hinterteil angesetzt
  g.strokeStyle = '#8a5a2b'; g.lineWidth = 5;
  g.beginPath();
  g.moveTo(4, H * 0.3);
  g.quadraticCurveTo(-14, H * 0.1 - Math.sin(t * 9) * 5, -16, -H * 0.5);
  g.stroke();

  // Rumpf
  g.fillStyle = '#a9702f';
  g.beginPath(); g.roundRect(0, 0, L, H, H / 2); g.fill();

  // Zugewandtes Beinpaar ueber dem Rumpf, heller
  bein(L * 0.26, a1, '#7b4f26');     // hinten, zugewandt
  bein(L * 0.72, a2, '#7b4f26');     // vorne,  zugewandt

  // Hals und Kopf sitzen am Rumpf an, mit Ueberlappung statt Kante an Kante
  const kx = L - kopfB * 0.9, ky = duckt ? -kopfH * 0.25 : -kopfH * 0.62;
  g.beginPath();
  g.moveTo(L - kopfB * 1.1, H * 0.2);
  g.lineTo(kx + kopfB * 0.25, ky + kopfH * 0.5);
  g.lineTo(kx + kopfB * 0.8, ky + kopfH);
  g.lineTo(L - kopfB * 0.3, H * 0.7);
  g.closePath(); g.fill();
  g.beginPath(); g.roundRect(kx, ky, kopfB, kopfH, kopfH * 0.42); g.fill();
  // Schnauze: deutlich kleiner als der Kopf, kein zweiter Kopf
  g.beginPath();
  g.roundRect(kx + kopfB * 0.72, ky + kopfH * 0.42, kopfB * 0.5, kopfH * 0.4, kopfH * 0.2);
  g.fill();
  // Schlappohr
  g.fillStyle = '#8a5a2b';
  g.beginPath();
  g.moveTo(kx + kopfB * 0.22, ky + kopfH * 0.12);
  g.quadraticCurveTo(kx - kopfB * 0.18, ky + kopfH * 0.45, kx + kopfB * 0.14, ky + kopfH * 0.95);
  g.quadraticCurveTo(kx + kopfB * 0.44, ky + kopfH * 0.55, kx + kopfB * 0.44, ky + kopfH * 0.1);
  g.fill();
  // Auge und Nase
  g.fillStyle = '#2a1a0c';
  g.beginPath(); g.ellipse(kx + kopfB * 0.62, ky + kopfH * 0.38, 2.4, 2.7, 0, 0, 7); g.fill();
  g.beginPath(); g.ellipse(kx + kopfB * 1.16, ky + kopfH * 0.6, 2.8, 2.6, 0, 0, 7); g.fill();
  g.restore();
}

function zeichnen(t) {
  const phase = (punkte % 600) / 300;          // 0..1 Tag, 1..2 Nacht
  const f = phase < 1 ? Math.min(phase * 4, 1) : Math.max(1 - (phase - 1) * 4, 0);
  nacht = f > 0.5;
  g.clearRect(0, 0, c.width, c.height);
  // Himmel und Wiese
  g.fillStyle = mischen('#bfe3f7', '#1b2740', f); g.fillRect(0, 0, c.width, BODEN);
  g.fillStyle = mischen('#6fbf5e', '#24422a', f); g.fillRect(0, BODEN, c.width, c.height - BODEN);
  g.strokeStyle = mischen('#59a349', '#1b3320', f); g.lineWidth = 3;
  for (let i = -(weg % 60); i < c.width; i += 60) {
    g.beginPath(); g.moveTo(i, BODEN + 12); g.lineTo(i + 14, BODEN + 4); g.stroke();
  }

  // Huerden zuerst, dann der Hund, dann die Tunnel -- so verschwindet er darin,
  // statt sichtbar davor vorbeizulaufen. Reihenfolge ist hier die ganze Wirkung.
  for (const o of hindernisse) {
    if (o.art === 'huerde') {
      const y = BODEN - o.hoehe;
      g.fillStyle = '#e2e6ee';
      g.fillRect(o.x, y, 5, o.hoehe); g.fillRect(o.x + o.breite - 5, y, 5, o.hoehe);
      g.fillStyle = '#d4382f';
      g.fillRect(o.x - 4, y, o.breite + 8, 8);
      g.fillRect(o.x - 4, y + 20, o.breite + 8, 6);
    }
  }

  hundZeichnen(t);

  for (const o of hindernisse) {
    if (o.art === 'tunnel') {
      // Roehre in Seitenansicht: Rundbogen ueber der ganzen Breite, Reifen
      // quer darueber, und die dunkle Muendung LINKS -- dort laeuft der Hund
      // hinein. Vorher lag sie rechts, und dann sah es aus wie ein Huegel.
      const dy = BODEN - o.lichte, mitte = BODEN - o.lichte / 2, rx = 13;
      g.fillStyle = '#e6663a';
      g.beginPath();
      g.moveTo(o.x + rx, BODEN);
      g.lineTo(o.x + rx, dy);
      g.quadraticCurveTo(o.x + o.breite / 2, dy - 26, o.x + o.breite, dy);
      g.lineTo(o.x + o.breite, BODEN);
      g.fill();
      // Reifen quer ueber die Roehre
      g.strokeStyle = '#c24f28'; g.lineWidth = 4;
      for (let i = 1; i <= 4; i++) {
        const bx = o.x + rx + i * (o.breite - rx) / 5;
        g.beginPath();
        g.moveTo(bx, BODEN);
        g.quadraticCurveTo(bx - 3, dy + 4, bx - 4, dy - 6 * (1 - Math.abs(i - 2.5) / 2.5));
        g.stroke();
      }
      // Muendung: heller Rand, dunkles Inneres
      g.fillStyle = '#f08a5d';
      g.beginPath(); g.ellipse(o.x + rx, mitte, rx, o.lichte / 2, 0, 0, 7); g.fill();
      g.fillStyle = '#20140f';
      g.beginPath(); g.ellipse(o.x + rx, mitte, rx - 5, o.lichte / 2 - 5, 0, 0, 7); g.fill();
    }
  }

  g.fillStyle = nacht ? '#e8ecf4' : '#123';
  g.font = 'bold 20px system-ui';
  g.fillText('Punkte: ' + punkte, 16, 32);
  g.font = '15px system-ui';
  g.fillText('Bester: ' + best, 16, 54);
  g.font = '13px system-ui';
  g.fillText('Tempo: ' + Math.round(tempo), 16, 74);

  // Die Schaltflaeche erscheint erst nach dem Spielende. Waehrend gespielt wird,
  // zoege sie nur den Tastaturfokus vom Spiel weg.
  knopf.hidden = laeuft;
  if (!laeuft) {
    g.fillStyle = 'rgba(10,14,20,.72)';
    g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = '#fff'; g.textAlign = 'center';
    g.font = 'bold 34px system-ui';
    g.fillText('Vorbei', c.width / 2, 130);
    g.font = '20px system-ui';
    g.fillText(punkte + ' Punkte  ·  bester Lauf ' + best, c.width / 2, 168);
    g.font = '16px system-ui';
    g.fillText('R oder Enter drücken, klicken oder die Schaltfläche nehmen', c.width / 2, 240);
    g.textAlign = 'left';
  }
}

// --- Schleife --------------------------------------------------------------
let vorher = performance.now();
function schritt(jetzt) {
  const dt = Math.min((jetzt - vorher) / 1000, 0.05);
  vorher = jetzt;
  if (laeuft) {
    zeit += dt;
    tempo += dt * 9;                    // wird mit der Zeit schneller
    weg += tempo * dt;
    punkte = Math.floor(weg / 20);
    if (punkte > best) {
      best = punkte;
      try { localStorage.setItem('agility_best', String(best)); } catch (e) {}
    }

    hund.vy += SCHWERKRAFT * dt;
    hund.y += hund.vy * dt;
    if (hund.y >= 0) { hund.y = 0; hund.vy = 0; hund.springt = false; }
    // In der Luft wird nicht geduckt -- aber die gedrueckte Taste bleibt gemerkt
    // und greift, sobald der Hund wieder steht.
    hund.duckt = duckTasteLiegt && !hund.springt;

    spawn -= tempo * dt;
    if (spawn <= 0) { setzen(); spawn = 260 + Math.random() * 220; }

    for (const o of hindernisse) o.x -= tempo * dt;
    hindernisse = hindernisse.filter(o => o.x + (o.breite || 0) > -60);
    for (const o of hindernisse) if (stoss(o)) { laeuft = false; break; }
  }
  zeichnen(zeit);
  requestAnimationFrame(schritt);
}
requestAnimationFrame(schritt);
</script>
</body>
</html>
